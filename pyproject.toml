[project]
name = "dsajudge"
dynamic = ["version"]
description = "Local-first DSA practice judge: LeetCode-style practice with hidden tests built from your reference solutions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dsa-judge contributors" }]
keywords = ["dsa", "leetcode", "judge", "interview", "practice", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "rich>=13.7",
    "watchfiles>=0.21",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Local AI intake (Phase 3). The core judge never imports these.
ai = [
    "httpx>=0.27",
    "pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.urls]
Homepage = "https://github.com/PkiPzi/dsa-judge"
Repository = "https://github.com/PkiPzi/dsa-judge"
Issues = "https://github.com/PkiPzi/dsa-judge/issues"

[project.scripts]
dsa = "dsajudge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dsajudge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dsajudge"]

# The public sample problems ship inside the wheel so `dsa open max-subarray` works after a
# plain `pip install` (see store/bank.py).
[tool.hatch.build.targets.wheel.force-include]
"fixtures/problems" = "dsajudge/_fixtures/problems"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not local' -ra"
markers = [
    "local: needs Ollama and whisper.cpp on the user's machine (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"fixtures/**" = ["F405", "F403", "UP", "N", "E741", "F821"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ruamel.*"]
ignore_missing_imports = true
