[project]
name = "dsajudge"
version = "0.1.0"
description = "Local-first DSA practice judge: LeetCode-style practice with hidden tests built from your reference solutions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "rich>=13.7",
    "watchfiles>=0.21",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Local AI intake (Phase 3). The core judge never imports these.
ai = [
    "httpx>=0.27",
    "pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.scripts]
dsa = "dsajudge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsajudge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not local' -ra"
markers = [
    "local: needs Ollama and whisper.cpp on the user's machine (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"fixtures/**" = ["F405", "F403", "UP", "N", "E741", "F821"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ruamel.*"]
ignore_missing_imports = true
