# PUBLIC FIXTURE: a classic design problem, statement written in our own words.
# Exercises mode: ops with a constructor parameter that the call arguments depend on
# (keys are drawn from a range proportional to the capacity so evictions really happen).
schema: 1
slug: lru-cache
title: Least-recently-used cache
tags: [design, hash-table, linked-list]
source: public-fixture

parts:
  - id: 1
    title: LRU cache
    statement: part1/statement.md
    mode: ops
    design:
      class: LRUCache
      constructor:
        - {name: capacity, type: int}
      methods:
        - {name: get, params: [{name: key, type: int}], returns: int}
        - {name: put, params: [{name: key, type: int}, {name: value, type: int}]}
    constraints:
      calls: {len: [1, 2e5], mix: {get: 5, put: 4}}
      ctor:
        capacity: {range: [1, 3000]}
      get:
        key: {range: [0, "min(10000, 2 * capacity)"]}
      put:
        key: {range: [0, "min(10000, 2 * capacity)"]}
        value: {range: [0, 1e5]}
    samples:
      - args:
          - ["LRUCache", "put", "put", "get", "put", "get", "put", "get", "get", "get"]
          - [[2], [1, 10], [2, 20], [1], [3, 30], [2], [4, 40], [1], [3], [4]]
        expected: [null, null, null, 10, null, -1, null, -1, 30, 40]
    checker: exact
    refs:
      - {lang: cpp, file: part1/ref/ref.cpp, origin: user, verified: true}
      - {lang: python, file: part1/ref/solution.py, origin: friend, verified: true}
    brute: {lang: python, file: part1/brute.py, origin: user, verified: true}
    limits: {time_ms: auto, memory_mb: 256}
